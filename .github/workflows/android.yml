name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Гард: файл не должен одновременно отслеживаться git и игнорироваться .gitignore.
      # Иначе .gitignore молча не действует, и мусор продолжает жить в индексе.
      - name: Guard: tracked but ignored
        run: |
          tracked_ignored=$(git ls-files -i -c --exclude-standard)
          if [ -n "$tracked_ignored" ]; then
            echo "::error::Файлы отслеживаются git, но внесены в .gitignore. Уберите их из индекса (git rm --cached) или из .gitignore:"
            echo "$tracked_ignored"
            exit 1
          fi
          echo "OK: конфликтов tracked/ignored нет"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit tests
        run: ./gradlew test

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Build release APK
        run: ./gradlew assembleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk