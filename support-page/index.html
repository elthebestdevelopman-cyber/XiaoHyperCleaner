<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>XiaoHyperCleaner</title>

  <!-- Open Graph -->
  <meta property="og:title" content="XiaoHyperCleaner — Support">
  <meta property="og:description" content="Support the XiaoHyperCleaner project: crypto, Boosty, ЮMoney, CloudTips, Telegram Stars.">
  <meta property="og:type" content="website">

  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <header class="app-header">
      <h1 id="pageTitle">XiaoHyperCleaner</h1>
      <div class="lang-switcher">
        <label for="langSelect" id="langLabel">Language</label>
        <select id="langSelect" aria-label="Language">
          <option value="ru">Русский</option>
          <option value="en">English</option>
          <option value="es">Español</option>
          <option value="zh">中文</option>
          <option value="hi">हिन्दी</option>
          <option value="pt">Português</option>
          <option value="id">Bahasa Indonesia</option>
        </select>
      </div>
    </header>

    <!-- Crypto -->
    <section class="card-section">
      <h2 id="cryptoTitle">Crypto</h2>
      <div class="crypto-grid">
        <div class="crypto-card">
          <h3 id="tonLabel">Gram / USDT (TON network)</h3>
          <canvas id="qrTon" width="220" height="220"></canvas>
          <code class="address" id="tonAddress"></code>
          <button type="button" class="copy-btn" id="copyTon">Copy</button>
          <p class="warning" id="tonOnlyWarning"></p>
        </div>
        <div class="crypto-card">
          <h3 id="trc20Label">USDT (TRON network)</h3>
          <canvas id="qrTrc20" width="220" height="220"></canvas>
          <code class="address" id="trc20Address"></code>
          <button type="button" class="copy-btn" id="copyTrc20">Copy</button>
          <p class="warning" id="trc20OnlyWarning"></p>
        </div>
      </div>
    </section>

    <!-- Russia -->
    <section class="card-section">
      <h2 id="russiaTitle">Russia</h2>
      <div class="btn-stack">
        <a class="link-btn" id="boostyLink" target="_blank" rel="noopener">Boosty</a>
        <a class="link-btn" id="yoomoneyLink" target="_blank" rel="noopener">ЮMoney</a>
        <a class="link-btn" id="cloudtipsLink" target="_blank" rel="noopener">CloudTips</a>
      </div>
    </section>

    <!-- Telegram Stars -->
    <section class="card-section">
      <h2 id="telegramTitle">Telegram Stars</h2>
      <p class="section-note" id="telegramExplanation"></p>
      <a class="link-btn" id="telegramLink" target="_blank" rel="noopener">@xiaohypercleaner</a>
    </section>

    <!-- Footer -->
    <footer class="app-footer">
      <p id="footerDisclaimer"></p>
      <p id="noTracking"></p>
    </footer>
  </main>

  <!-- QR generator (CDN) -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <!-- App data + logic (relative paths) -->
  <script src="config.js"></script>
  <script src="i18n.js"></script>
  <script src="app.js"></script>
</body>
</html>
