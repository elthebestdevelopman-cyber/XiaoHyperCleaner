# Crash-логи JVM (hs_err_pid*.log) пишутся в игнорируемую build/, а не в корень репозитория.
# Если build/ ещё не создана, HotSpot откатывается на поведение по умолчанию — лог не теряется.
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:MaxMetaspaceSize=1g -XX:ErrorFile=build/hs_err_%p.log
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
org.gradle.configuration-cache=true